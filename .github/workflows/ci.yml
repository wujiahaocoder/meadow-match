name: Validate game

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test generator, rules and encrypted saves
        run: npm test
      - name: Verify standalone HTML matches source
        run: |
          npm run build
          git diff --exit-code -- index.html
